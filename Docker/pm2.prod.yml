apps:
  - name: 'shinobi-camera'
    script: '/home/Shinobi/camera.js'
    instances: 1
    exec_mode: 'fork'
    watch: false
    max_memory_restart: '1G'
    env:
      NODE_ENV: 'production'
    error_file: '/var/lib/shinobi/logs/camera-error.log'
    out_file: '/var/lib/shinobi/logs/camera-out.log'
    log_file: '/var/lib/shinobi/logs/camera.log'
    time: true
    kill_timeout: 5000
    restart_delay: 1000
    max_restarts: 10
    min_uptime: '10s'

  - name: 'replay-server'
    script: '/home/Shinobi/replay-server/server.js'
    instances: 1
    exec_mode: 'fork'
    watch: false
    max_memory_restart: '512M'
    env:
      NODE_ENV: 'production'
      PORT: 3010
      # Garante que o replay use os mesmos vídeos que o Shinobi
      SHINOBI_VIDEOS_PATH: '/var/lib/shinobi/videos'
    error_file: '/var/lib/shinobi/logs/replay-error.log'
    out_file: '/var/lib/shinobi/logs/replay-out.log'
    log_file: '/var/lib/shinobi/logs/replay.log'
    time: true
    kill_timeout: 5000
    restart_delay: 1000
    max_restarts: 10
    min_uptime: '10s'