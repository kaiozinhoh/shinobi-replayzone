# Configuração para EasyPanel
version: '1'

services:
  shinobi:
    image: ghcr.io/your-username/shinobi:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DB_HOST: shinobi-db
      DB_USER: shinobi
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: shinobi
      DB_PORT: 3306
      DB_TYPE: mysql
      SUBSCRIPTION_ID: ${SUBSCRIPTION_ID}
      PLUGIN_KEYS: ${PLUGIN_KEYS}
      SSL_ENABLED: ${SSL_ENABLED}
    volumes:
      - shinobi_data:/var/lib/shinobi
      - shinobi_videos:/var/lib/shinobi/videos
      - shinobi_streams:/var/lib/shinobi/streams
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0
        reservations:
          memory: 512M
          cpus: 0.5

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: shinobi
      MYSQL_USER: shinobi
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5

volumes:
  shinobi_data:
  shinobi_videos:
  shinobi_streams:
  db_data:

# Configurações específicas do EasyPanel
easypanel:
  domain: your-domain.com
  ssl: true
  auto_deploy: true
  backup:
    enabled: true
    schedule: "0 2 * * *"  # Todo dia às 2h da manhã
    retention: 30  # 30 dias
  monitoring:
    enabled: true
    alerts:
      - type: health_check
        threshold: 3  # 3 falhas consecutivas
      - type: resource_usage
        memory_threshold: 80  # 80% de uso de memória
        cpu_threshold: 80     # 80% de uso de CPU
  scaling:
    min_replicas: 1
    max_replicas: 3
    cpu_target: 70
    memory_target: 70