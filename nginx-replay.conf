server {
    listen 8081;
    server_name _;

    access_log /var/log/nginx/replay_access.log;
    error_log  /var/log/nginx/replay_error.log;

    # Diretório onde o replay-server move os vídeos prontos
    root /var/www/replay-videos;

    # Servir arquivos de vídeo gerados pelo sistema de replay
    location /videos/ {
        alias /var/www/replay-videos/;
        autoindex on;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';

        types {
            application/vnd.apple.mpegurl m3u8;
            video/MP2T                      ts;
            video/mp4                       mp4;
            video/x-matroska                mkv;
        }
    }

    # Servir arquivos HLS gerados pelo replay-server (se desejar acessar diretamente)
    location /hls/ {
        alias /app/hls/;
        autoindex on;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';

        types {
            application/vnd.apple.mpegurl m3u8;
            video/MP2T                      ts;
        }
    }
}

